name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -short ./...

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            goarm: ""
            ext: ""
            name: linux-amd64
          - goos: linux
            goarch: arm64
            goarm: ""
            ext: ""
            name: linux-arm64
          - goos: linux
            goarch: arm
            goarm: "7"
            ext: ""
            name: linux-armv7
          - goos: darwin
            goarch: amd64
            goarm: ""
            ext: ""
            name: darwin-amd64
          - goos: darwin
            goarch: arm64
            goarm: ""
            ext: ""
            name: darwin-arm64
          - goos: windows
            goarch: amd64
            goarm: ""
            ext: ".exe"
            name: windows-amd64
          - goos: windows
            goarch: arm64
            goarm: ""
            ext: ".exe"
            name: windows-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          mkdir -p bin
          go build -trimpath -ldflags "-s -w" \
            -o "bin/wojak-keeper-${{ matrix.name }}${{ matrix.ext }}" ./cmd/wojak-keeper
